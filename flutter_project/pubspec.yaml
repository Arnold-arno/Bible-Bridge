name: bible_timeline_companion
description: A beautiful scripture reader with chronological timelines, cross-references, book overviews, and daily devotions.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local Persistence
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2

  # State Management
  provider: ^6.1.1

  # Network & API
  http: ^1.1.2
  postgres: ^3.1.2

  # UI & Styling
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_markdown: ^0.6.18+1
  flutter_tts: ^3.8.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
